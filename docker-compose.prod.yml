# Production overlay: the app sits behind the server's shared Caddy, which
# terminates TLS (automatic Let's Encrypt) for every app on the machine and
# reaches this one over the "edge" network. The app is no longer published on
# the host. Setup and the site file: README "Deploying on a server".
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  xpenses:
    ports: !reset []
    expose:
      - "8080"
    environment:
      XPENSES_TRUSTED_PROXY: "true"
      XPENSES_SECURE_COOKIES: auto
      XPENSES_CORS_ORIGIN: ""
    networks:
      - default
      - edge

networks:
  edge:
    external: true
