services:
  xpenses:
    build: .
    container_name: xpenses
    restart: unless-stopped
    # Bound to localhost on the host. Change to "8080:8080" only if you
    # understand the implications (see README "Security").
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - xpenses-data:/data
    environment:
      XPENSES_LOG_LEVEL: info
      XPENSES_MAX_UPLOAD_BYTES: "10485760"
      XPENSES_DEFAULT_CURRENCY: BTN
      XPENSES_SECURE_COOKIES: auto
      XPENSES_TRUSTED_PROXY: "false"

volumes:
  xpenses-data:
